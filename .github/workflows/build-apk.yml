name: Build Secure Notes APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Locate Android project
        shell: bash
        run: |
          if [[ -f settings.gradle.kts ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [[ -f SecureNotes/settings.gradle.kts ]]; then
            echo "PROJECT_DIR=SecureNotes" >> "$GITHUB_ENV"
          else
            echo "Не найден settings.gradle.kts в корне или в папке SecureNotes" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secure-notes-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
